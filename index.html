<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مدى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div style="padding: 30px; text-align: center; margin-top: 50px;">
            <img src="logo.png" class="logo-img">
            <h2 style="color: var(--primary);">مرحباً بك في مدى</h2>
            
            <div id="login-form">
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة المرور">
                <button class="btn btn-primary" id="btn-login">تسجيل الدخول</button>
                <button class="btn btn-outline" onclick="document.getElementById('login-form').classList.add('hidden'); document.getElementById('reg-form').classList.remove('hidden');">إنشاء حساب جديد</button>
            </div>

            <div id="reg-form" class="hidden">
                <input type="text" id="r-name" placeholder="الاسم الكامل">
                <input type="email" id="r-email" placeholder="البريد الإلكتروني">
                <input type="password" id="r-pass" placeholder="كلمة المرور">
                <button class="btn btn-primary" id="btn-signup">إنشاء الحساب</button>
                <p onclick="location.reload()" style="cursor: pointer; color: #666;">رجوع لتسجيل الدخول</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from './app.js';
        
        // التحقق من الحالة
        checkAuth('index');

        // ربط الأزرار بالدوال الموجودة في app.js
        document.getElementById('btn-login').addEventListener('click', () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            window.loginUser(e, p);
        });

        document.getElementById('btn-signup').addEventListener('click', () => {
            const n = document.getElementById('r-name').value;
            const e = document.getElementById('r-email').value;
            const p = document.getElementById('r-pass').value;
            window.registerUser(e, p, { fullName: n, createdAt: new Date() });
        });
    </script>
</body>
</html>
